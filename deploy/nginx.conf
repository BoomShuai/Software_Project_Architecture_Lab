# =============================================================================
# Nginx reverse proxy / load balancer for the GildedRose backend
# Experiment 4: horizontal scale-out (load balancing).
#
# The backend is single-process. To scale beyond one process's capacity we run
# N identical instances on different ports and let Nginx distribute requests
# across them. This turns vertical scale-up (thread pool inside one process)
# into horizontal scale-out (many processes, optionally many machines).
#
# Run locally (outside Docker):
#   ./GildedRoseBackend --serve --port 9001 --mode pool --threads 4 &
#   ./GildedRoseBackend --serve --port 9002 --mode pool --threads 4 &
#   ./GildedRoseBackend --serve --port 9003 --mode pool --threads 4 &
#   nginx -c $(pwd)/deploy/nginx.conf -p $(pwd)/deploy
#   # traffic enters at http://localhost:8088
# =============================================================================

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # ----- Upstream pool of backend instances -------------------------------
    # least_conn sends each new request to the instance with the fewest active
    # connections, which load-balances better than round-robin when request
    # latencies vary (the cached vs uncached report path is a good example).
    upstream gildedrose_backend {
        least_conn;
        server 127.0.0.1:9001 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:9002 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:9003 max_fails=3 fail_timeout=5s;

        # Reuse upstream connections to cut per-request TCP handshake cost.
        keepalive 64;
        keepalive_timeout 60s;
    }

    # Compact access log; comment out for max throughput during benchmarks.
    access_log off;

    server {
        listen 8088;
        server_name localhost;

        location / {
            proxy_pass http://gildedrose_backend;

            # Required for upstream keepalive to take effect.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Preserve client context for the backend / logs.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # If one instance is down, transparently retry the next one.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
        }

        # Lightweight health endpoint for the load balancer itself.
        location = /lb-health {
            return 200 "nginx lb ok\n";
            add_header Content-Type text/plain;
        }
    }
}

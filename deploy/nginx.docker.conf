# =============================================================================
# Nginx load balancer config for the Docker Compose deployment.
# Identical strategy to deploy/nginx.conf, but the upstream targets are Compose
# service names on the shared network instead of localhost ports.
# =============================================================================
worker_processes auto;
events { worker_connections 4096; }

http {
    upstream gildedrose_backend {
        least_conn;
        server backend1:8080 max_fails=3 fail_timeout=5s;
        server backend2:8080 max_fails=3 fail_timeout=5s;
        server backend3:8080 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    access_log off;

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://gildedrose_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
        }

        location = /lb-health {
            return 200 "nginx lb ok\n";
            add_header Content-Type text/plain;
        }
    }
}
